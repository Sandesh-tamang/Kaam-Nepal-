<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kaam - Login</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <style>
      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #eefcf8, #f8fbff);
        font-family: Arial, sans-serif;
      }

      /* Main container */
      .login-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      /* Login card */
      .login-card {
        width: 100%;
        max-width: 450px;
        background: white;
        border: none;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 15px 45px rgba(0, 0, 0, 0.1);
      }

      /* Logo */
      .logo {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: linear-gradient(135deg, #d8fff4, #e8faff);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 15px;
      }

      .logo-k {
        font-size: 50px;
        font-weight: bold;
        background: linear-gradient(135deg, #00c98d, #008fd5);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Brand */
      .brand {
        font-size: 30px;
        font-weight: 700;
        text-align: center;
        margin-bottom: 5px;
        color: #222;
      }

      .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 30px;
      }

      /* Form labels */
      .form-label {
        font-weight: 600;
        color: #333;
      }

      /* Input */
      .form-control {
        height: 50px;
        border-radius: 10px;
        border: 1px solid #dfe5e8;
        padding-left: 45px;
      }

      .form-control:focus {
        border-color: #00b98b;
        box-shadow: 0 0 0 0.2rem rgba(0, 201, 141, 0.15);
      }

      /* Input icon */
      .input-group-custom {
        position: relative;
      }

      .input-icon {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #00b98b;
        z-index: 5;
      }

      /* Location button */
      .location-btn {
        height: 50px;
        border-radius: 10px;
        border: 1px solid #dfe5e8;
        background: #f8fafb;
        color: #333;
        text-align: left;
      }

      .location-btn:hover {
        background: #eefcf8;
        border-color: #00b98b;
      }

      /* Login button */
      .login-btn {
        height: 52px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #00c98d, #008fd5);
        color: white;
        font-size: 17px;
        font-weight: 600;
        transition: 0.3s;
      }

      .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 180, 140, 0.25);
      }

      /* Remember / forgot */
      .form-check-label {
        color: #666;
        font-size: 14px;
      }

      .forgot {
        color: #00a982;
        text-decoration: none;
        font-size: 14px;
      }

      .forgot:hover {
        text-decoration: underline;
      }

      /* Register */
      .register {
        text-align: center;
        margin-top: 25px;
        color: #777;
      }

      .register a {
        color: #00a982;
        text-decoration: none;
        font-weight: 600;
      }

      .register a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="login-wrapper">
      <div class="login-card">
        <!-- Logo -->
        <div class="logo">
          <div class="logo-k">K</div>
        </div>

        <!-- Brand -->
        <h1 class="brand">Kaam</h1>

        <p class="subtitle">Sign in to continue to your account</p>

        <!-- Login Form -->
        <form>
          <!-- ID -->
          <div class="mb-3">
            <label for="userId" class="form-label"> ID </label>

            <div class="input-group-custom">
              <i class="bi bi-person input-icon"></i>

              <input
                type="text"
                class="form-control"
                id="userId"
                placeholder="Enter your ID"
                required
              />
            </div>
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label for="password" class="form-label"> Password </label>

            <div class="input-group-custom">
              <i class="bi bi-lock input-icon"></i>

              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="Enter your password"
                required
              />
            </div>
          </div>

          <!-- Location -->
          <div class="mb-3">
            <label class="form-label"> Location </label>

            <button
              type="button"
              class="btn location-btn w-100"
              onclick="getLocation()"
            >
              <i class="bi bi-geo-alt-fill text-success me-2"></i>

              <span id="locationText"> Set your location </span>
            </button>
          </div>

          <!-- Remember + Forgot Password -->
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember" />

              <label class="form-check-label" for="remember">
                Remember me
              </label>
            </div>

            <a href="#" class="forgot"> Forgot password? </a>
          </div>

          <!-- Login Button -->
          <button type="submit" class="btn login-btn w-100">
            <i class="bi bi-box-arrow-in-right me-2"></i>

            Login
          </button>
        </form>

        <!-- Register -->
        <div class="register">
          Don't have an account?

          <a href="#"> Create Account </a>
        </div>
      </div>
    </div>

    <!-- Location JavaScript -->
    <script>
      function getLocation() {
        const locationText = document.getElementById("locationText");

        if (!navigator.geolocation) {
          locationText.innerText = "Location not supported";

          return;
        }

        locationText.innerText = "Getting location...";

        navigator.geolocation.getCurrentPosition(
          function (position) {
            const latitude = position.coords.latitude;

            const longitude = position.coords.longitude;

            locationText.innerText = "Location detected";

            console.log("Latitude:", latitude);

            console.log("Longitude:", longitude);
          },

          function () {
            locationText.innerText = "Unable to get location";
          },
        );
      }
    </script>
  </body>
</html>
